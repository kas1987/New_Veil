[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-dssm"
version = "0.1.0"
description = "Prism DSSM/Veil layered social-physics engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Prism" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/prism_dssm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
