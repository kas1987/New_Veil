name: Review Loopback Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-loopback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-unresolved-threads:
    name: review loopback · unresolved threads
    runs-on: ubuntu-latest
    if: github.event.pull_request != null
    steps:
      - name: Check unresolved review threads and update sticky summary
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const query = `
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100) {
                      nodes {
                        id
                        isResolved
                        path
                        line
                        comments(first: 1) {
                          nodes {
                            author { login }
                            body
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const res = await github.graphql(query, { owner, repo, pr: prNumber });
            const threads = res.repository.pullRequest.reviewThreads.nodes;
            const unresolved = threads.filter((t) => !t.isResolved);

            const marker = "<!-- veil-review-loopback-summary -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 50,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            let body = `${marker}\n### Review Loopback Gate\n`;
            if (unresolved.length === 0) {
              body += `All **${threads.length}** review thread(s) are resolved. Ready for merge.`;
            } else {
              body += `**${unresolved.length}** unresolved review thread(s) require action:\n\n`;
              for (const t of unresolved) {
                const c = t.comments.nodes[0] || {};
                const author = c.author ? c.author.login : "reviewer";
                const firstLine = (c.body || "").split("\n").find((l) => l.trim().length > 0) || "";
                const loc = t.line ? `${t.path}:${t.line}` : (t.path || "general");
                body += `- \`${loc}\` (@${author}) — ${firstLine.slice(0, 120)}\n`;
              }
              body += `\nRun \`python scripts/pr_review_loop.py list --pr ${prNumber}\` locally to inspect, fix, reply, and resolve.`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (threads.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

            if (unresolved.length > 0) {
              core.setFailed(`${unresolved.length} unresolved review thread(s) remain on PR #${prNumber}.`);
            }
