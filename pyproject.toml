[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-veil"
version = "0.4.0"
description = "The Veil — Interactive Narrative RPG, World Simulation, and Observatory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
observatory = [
    "gradio>=4.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "04_runtime/dssm_engine/src"]
testpaths = [
    "tests",
    "05_alignment/tests",
    "04_runtime/dssm_engine/tests",
]
norecursedirs = [
    "90_intake",
    "99_archive",
    "node_modules",
    "07_ui/game_client",
    ".git",
    ".venv",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
exclude = ["90_intake", "99_archive", "07_ui/game_client"]

[tool.ruff.lint]
ignore = [
    "N999",    # Intentional Chromatic Tree numbered package folders (01_districts, etc.)
    "BLE001",  # Defensive exception fallbacks in runtime/UI adapters
    "TRY004",  # ValueError vs TypeError in legacy DSSM/alignment validators
    "RUF013",  # Implicit Optional in legacy signatures
    "DTZ005",  # Local naive timestamps in sqlite/log helpers
    "S110",    # Intentional try-except-pass in cleanup/fallback paths
    "S112",    # Intentional try-except-continue in log parsing
    "PLW0602", # Global read access
]
