<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#050812;color:#fff;font-family:'Prompt',sans-serif}
  .card{padding:24px 28px;display:flex;flex-direction:column;gap:12px;max-width:560px}
  .lbl{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);padding:0 4px;margin-bottom:4px}
  .inp{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.9);backdrop-filter:blur(8px);outline:none;border-radius:12px;padding:10px 14px;font-size:14px;font-family:inherit;width:100%;box-sizing:border-box}
  .inp::placeholder{color:rgba(255,255,255,.28)}
  .inp.focus{border-color:rgba(6,182,212,.55);box-shadow:0 0 0 2px rgba(6,182,212,.12),inset 0 0 12px rgba(6,182,212,.04)}
  .row{display:flex;flex-direction:column}
</style></head>
<body><div class="card">
  <div class="row"><label class="lbl">Default</label><input class="inp" placeholder="Search models…"></div>
  <div class="row"><label class="lbl">Focused</label><input class="inp focus" value="cyan palette"></div>
  <div class="row"><label class="lbl">Textarea</label><textarea class="inp" rows="2" placeholder="Describe what you want to generate…"></textarea></div>
</div></body></html>
