<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#050812;background-image:radial-gradient(ellipse 80% 50% at 15% 10%,rgba(6,182,212,.12),transparent 60%),radial-gradient(ellipse 50% 40% at 85% 90%,rgba(124,58,237,.12),transparent 60%);color:#fff;font-family:'Prompt',sans-serif;overflow:hidden}
  .card{padding:26px 28px;display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:baseline;gap:16px}
  .meta{width:80px;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
  .prism{background:linear-gradient(115deg,#3b82f6 0%,#22d3ee 18%,#a78bfa 36%,#e879f9 52%,#fb7185 66%,#fb923c 80%,#facc15 92%,#4ade80 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flow 7s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(6,182,212,.25))}
  @keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .d{font-size:54px;font-weight:700;letter-spacing:-.035em;line-height:1}
  .h1{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
  .h2{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .h3{font-size:19px;font-weight:600;letter-spacing:-.01em;color:#fff;text-shadow:0 0 16px rgba(6,182,212,.4)}
  .accent{color:#22d3ee;text-shadow:0 0 20px rgba(6,182,212,.55)}
  .serif-k{font-family:'Prompt',sans-serif;font-style:italic;font-weight:300;color:rgba(255,255,255,.45)}
</style></head>
<body><div class="card">
  <div class="row"><span class="meta">Display 64</span><span class="d prism">Chromatic</span></div>
  <div class="row"><span class="meta">H1 36</span><span class="h1"><span class="prism">Design</span> <span class="serif-k">palettes</span></span></div>
  <div class="row"><span class="meta">H2 30</span><span class="h2">Models <span class="accent">·</span> <span style="color:rgba(255,255,255,.75)">24 available</span></span></div>
  <div class="row"><span class="meta">H3 20</span><span class="h3">Checkpoint</span></div>
</div></body></html>
