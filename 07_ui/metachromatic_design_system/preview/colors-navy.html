<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#050812;color:#fff;font-family:'Prompt',sans-serif;}
  .card{padding:24px 28px;display:flex;gap:16px;flex-wrap:wrap}
  .sw{width:130px;height:104px;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.08);font-family:'JetBrains Mono',monospace}
  .sw .nm{font-size:10px;opacity:.65;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.08em}
  .sw .hex{font-size:10px;opacity:.75;color:rgba(255,255,255,.85)}
</style></head>
<body><div class="card">
  <div class="sw" style="background:#050812"><div class="nm">app base</div><div class="hex">#050812</div></div>
  <div class="sw" style="background:#0a0e1a"><div class="nm">navy</div><div class="hex">#0A0E1A</div></div>
  <div class="sw" style="background:#141a2e"><div class="nm">navy light</div><div class="hex">#141A2E</div></div>
  <div class="sw" style="background:#1e2842"><div class="nm">navy mid</div><div class="hex">#1E2842</div></div>
  <div class="sw" style="background:#232d4a"><div class="nm">navy surface</div><div class="hex">#232D4A</div></div>
</div></body></html>
