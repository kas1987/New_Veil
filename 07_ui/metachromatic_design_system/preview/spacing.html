<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0a0e1a;color:#fff;font-family:'Prompt',sans-serif}
  .card{padding:28px;display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .s{display:flex;flex-direction:column;align-items:center;gap:6px}
  .b{background:linear-gradient(135deg,#06b6d4,#7c3aed);border-radius:6px;width:30px}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.4)}
  .n{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.7);font-weight:600}
</style></head>
<body><div class="card">
  <div class="s"><div class="b" style="height:4px"></div><span class="n">1</span><span class="lbl">4</span></div>
  <div class="s"><div class="b" style="height:8px"></div><span class="n">2</span><span class="lbl">8</span></div>
  <div class="s"><div class="b" style="height:12px"></div><span class="n">3</span><span class="lbl">12</span></div>
  <div class="s"><div class="b" style="height:16px"></div><span class="n">4</span><span class="lbl">16</span></div>
  <div class="s"><div class="b" style="height:20px"></div><span class="n">5</span><span class="lbl">20</span></div>
  <div class="s"><div class="b" style="height:24px"></div><span class="n">6</span><span class="lbl">24</span></div>
  <div class="s"><div class="b" style="height:32px"></div><span class="n">8</span><span class="lbl">32</span></div>
  <div class="s"><div class="b" style="height:40px"></div><span class="n">10</span><span class="lbl">40</span></div>
  <div class="s"><div class="b" style="height:48px"></div><span class="n">12</span><span class="lbl">48</span></div>
  <div class="s"><div class="b" style="height:64px"></div><span class="n">16</span><span class="lbl">64</span></div>
</div></body></html>
