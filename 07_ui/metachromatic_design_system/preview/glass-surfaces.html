<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#050812;background-image:radial-gradient(ellipse 70% 45% at 15% 0%,rgba(6,182,212,0.07),transparent 65%);color:#fff;font-family:'Prompt',sans-serif}
  .card{padding:24px 28px;display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
  .pnl{flex:1;min-width:180px;height:120px;padding:14px;border-radius:16px;display:flex;flex-direction:column;justify-content:space-between}
  .pnl .nm{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.45);font-weight:500}
  .pnl .desc{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.45);line-height:1.4}
  .a{background:rgba(10,14,26,.65);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 32px rgba(0,0,0,.37)}
  .b{background:rgba(20,26,46,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 16px rgba(0,0,0,.25)}
  .c{background:rgba(10,14,26,.85);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 48px rgba(0,0,0,.5)}
  .d{background:rgba(255,255,255,.04);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.07)}
</style></head>
<body><div class="card">
  <div class="pnl a"><span class="nm">Glass</span><span class="desc">blur 16 · bg .65<br>shadow md</span></div>
  <div class="pnl b"><span class="nm">Glass Light</span><span class="desc">blur 8 · bg .55<br>shadow sm</span></div>
  <div class="pnl c"><span class="nm">Glass Heavy</span><span class="desc">blur 24 · bg .85<br>shadow lg</span></div>
  <div class="pnl d"><span class="nm">Glass White</span><span class="desc">blur 20 · sat 180<br>rgba white .04</span></div>
</div></body></html>
