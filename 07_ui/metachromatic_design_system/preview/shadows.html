<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#141a2e;color:#fff;font-family:'Prompt',sans-serif}
  .card{padding:32px 28px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;justify-content:space-around}
  .s{display:flex;flex-direction:column;align-items:center;gap:10px}
  .b{background:rgba(10,14,26,.65);border:1px solid rgba(255,255,255,.08);width:88px;height:72px;border-radius:12px}
  .sm{box-shadow:0 4px 16px rgba(0,0,0,.25)}
  .md{box-shadow:0 8px 32px rgba(0,0,0,.37)}
  .lg{box-shadow:0 12px 48px rgba(0,0,0,.5)}
  .gc{box-shadow:0 0 24px rgba(6,182,212,.35)}
  .gp{box-shadow:0 0 24px rgba(124,58,237,.35)}
  .gw{box-shadow:0 0 24px rgba(249,115,22,.35)}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.05em}
</style></head>
<body><div class="card">
  <div class="s"><div class="b sm"></div><span class="lbl">sm</span></div>
  <div class="s"><div class="b md"></div><span class="lbl">md</span></div>
  <div class="s"><div class="b lg"></div><span class="lbl">lg</span></div>
  <div class="s"><div class="b gc"></div><span class="lbl">glow cyan</span></div>
  <div class="s"><div class="b gp"></div><span class="lbl">glow purple</span></div>
  <div class="s"><div class="b gw"></div><span class="lbl">glow warm</span></div>
</div></body></html>
