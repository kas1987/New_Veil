<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0a0e1a;color:#fff;font-family:'Prompt',sans-serif}
  .card{padding:28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .rad{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);width:72px;height:72px}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.05em}
  .v{font-size:10px;color:rgba(255,255,255,.35);font-family:'JetBrains Mono',monospace}
</style></head>
<body><div class="card">
  <div class="rad"><div class="box" style="border-radius:4px"></div><span class="lbl">xs</span><span class="v">4px</span></div>
  <div class="rad"><div class="box" style="border-radius:8px"></div><span class="lbl">sm</span><span class="v">8px</span></div>
  <div class="rad"><div class="box" style="border-radius:12px"></div><span class="lbl">md</span><span class="v">12px</span></div>
  <div class="rad"><div class="box" style="border-radius:16px"></div><span class="lbl">default</span><span class="v">16px</span></div>
  <div class="rad"><div class="box" style="border-radius:24px"></div><span class="lbl">lg</span><span class="v">24px</span></div>
  <div class="rad"><div class="box" style="border-radius:32px"></div><span class="lbl">xl</span><span class="v">32px</span></div>
  <div class="rad"><div class="box" style="border-radius:9999px"></div><span class="lbl">full</span><span class="v">pill</span></div>
</div></body></html>
