<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#050812;color:#fff;font-family:'Prompt',sans-serif}
  .card{padding:24px 28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{font-size:11px;padding:4px 10px;border-radius:6px;font-weight:500}
  .cyan{background:rgba(6,182,212,.2);color:#22d3ee}
  .white{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
  .emerald{background:rgba(34,197,94,.15);color:#4ade80}
  .rose{background:rgba(225,29,72,.15);color:#fb7185}
  .yellow{background:rgba(234,179,8,.15);color:#facc15}
  .purple{background:rgba(124,58,237,.15);color:#a78bfa}
  .score{border:1px solid;padding:4px 12px;border-radius:6px;font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px}
  .sp{border-color:#22c55e;color:#4ade80;box-shadow:0 0 12px rgba(34,197,94,.3)}
  .sa{border-color:#06b6d4;color:#22d3ee;box-shadow:0 0 12px rgba(6,182,212,.3)}
  .sb{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.7)}
  .sf{border-color:#e11d48;color:#fb7185;box-shadow:0 0 12px rgba(225,29,72,.3)}
  .sun{border-color:#eab308;color:#facc15;box-shadow:0 0 12px rgba(234,179,8,.3)}
</style></head>
<body><div class="card">
  <span class="pill cyan">Aurora</span>
  <span class="pill white">asian</span>
  <span class="pill emerald">Done</span>
  <span class="pill rose">Failed</span>
  <span class="pill yellow">Running…</span>
  <span class="pill purple">Queued</span>
  <span class="score sp">S+</span>
  <span class="score sa">S</span>
  <span class="score sb">B</span>
  <span class="score sf">F</span>
  <span class="score sun">UNSCORED</span>
</div></body></html>
