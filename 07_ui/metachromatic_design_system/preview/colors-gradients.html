<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#050812;color:#fff;font-family:'Prompt',sans-serif;overflow:hidden}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 10%,rgba(6,182,212,.18),transparent 60%),radial-gradient(ellipse 40% 40% at 85% 90%,rgba(124,58,237,.15),transparent 60%);pointer-events:none}
  .card{padding:24px 28px;display:flex;flex-direction:column;gap:14px;position:relative}
  .g{height:56px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:11px;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.9);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 8px 32px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08)}
  .g::before{content:'';position:absolute;inset:0;background-size:300% 300%;animation:drift 8s ease-in-out infinite;mix-blend-mode:screen;opacity:.85}
  .g::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 3.5s ease-in-out infinite;pointer-events:none}
  .nm{text-transform:uppercase;letter-spacing:.1em;font-weight:600;opacity:.95;text-shadow:0 1px 3px rgba(0,0,0,.5);z-index:2;position:relative}
  .var{opacity:.7;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:2;position:relative}
  .p1::before{background:linear-gradient(135deg,rgba(30,58,138,.45) 0%,rgba(6,182,212,.45) 15%,rgba(124,58,237,.45) 30%,rgba(192,38,211,.45) 45%,rgba(225,29,72,.45) 55%,rgba(249,115,22,.45) 70%,rgba(234,179,8,.45) 85%,rgba(34,197,94,.45) 100%)}
  .p2::before{background:linear-gradient(135deg,rgba(30,58,138,.4),rgba(6,182,212,.4),rgba(124,58,237,.4))}
  .p3::before{background:linear-gradient(135deg,rgba(225,29,72,.4),rgba(249,115,22,.4),rgba(234,179,8,.4),rgba(34,197,94,.4))}
  .p4::before{background:linear-gradient(135deg,rgba(6,182,212,.55),rgba(14,116,144,.55));box-shadow:inset 0 0 30px rgba(6,182,212,.15)}
  @keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes shimmer{0%,100%{background-position:-100% 0}50%{background-position:200% 0}}
  @keyframes twinkle{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:9999px;box-shadow:0 0 6px #fff,0 0 10px rgba(255,255,255,.6);animation:twinkle 2.5s ease-in-out infinite}
</style></head>
<body><div class="card">
  <div class="g p1">
    <span class="star" style="top:14px;left:22%;animation-delay:.2s"></span>
    <span class="star" style="top:38px;left:56%;animation-delay:1.1s"></span>
    <span class="star" style="top:22px;left:78%;animation-delay:.6s"></span>
    <span class="nm">Prismatic 135°</span><span class="var">--mc-gradient-prismatic</span>
  </div>
  <div class="g p2">
    <span class="star" style="top:18px;left:34%;animation-delay:.4s"></span>
    <span class="star" style="top:40px;left:68%;animation-delay:1.4s"></span>
    <span class="nm">Cool</span><span class="var">--mc-gradient-cool</span>
  </div>
  <div class="g p3">
    <span class="star" style="top:12px;left:28%;animation-delay:.9s"></span>
    <span class="star" style="top:36px;left:72%;animation-delay:.1s"></span>
    <span class="nm">Warm</span><span class="var">--mc-gradient-warm</span>
  </div>
  <div class="g p4">
    <span class="star" style="top:20px;left:18%;animation-delay:.3s"></span>
    <span class="star" style="top:34px;left:62%;animation-delay:1.2s"></span>
    <span class="nm">Primary button</span><span class="var">--mc-gradient-primary</span>
  </div>
</div></body></html>
