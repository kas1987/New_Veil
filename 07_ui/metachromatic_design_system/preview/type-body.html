<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#050812;background-image:radial-gradient(ellipse 70% 45% at 15% 0%,rgba(6,182,212,.1),transparent 65%),radial-gradient(ellipse 50% 40% at 90% 100%,rgba(124,58,237,.08),transparent 60%);color:#fff;font-family:'Prompt',sans-serif;overflow:hidden}
  .card{padding:24px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;align-items:stretch}
  .chip{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.1em;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}
  .chip::before{content:'';width:5px;height:5px;border-radius:9999px;background:#22d3ee;box-shadow:0 0 8px rgba(6,182,212,.7)}
  .tile{border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);background:rgba(10,14,26,.55);box-shadow:0 8px 28px rgba(0,0,0,.35)}
  .tile.hero{background:linear-gradient(135deg,rgba(6,182,212,.18),rgba(124,58,237,.14) 55%,rgba(192,38,211,.1));grid-row:span 2}
  .tile.mono{background:linear-gradient(135deg,rgba(10,14,26,.85),rgba(20,26,46,.7));border-color:rgba(6,182,212,.25)}
  .tile.label{background:linear-gradient(135deg,rgba(234,179,8,.1),rgba(249,115,22,.08));border-color:rgba(234,179,8,.18)}
  .tile.small{background:rgba(20,26,46,.55)}
  .tile.muted{background:rgba(255,255,255,.02);border-style:dashed;border-color:rgba(255,255,255,.1)}
  .hero-quote{font-size:20px;font-weight:400;line-height:1.35;color:rgba(255,255,255,.92);letter-spacing:-.01em}
  .hero-quote em{font-style:italic;font-weight:300;background:linear-gradient(115deg,#22d3ee,#a78bfa,#e879f9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero-cite{margin-top:16px;font-size:11px;color:rgba(255,255,255,.4);font-family:'JetBrains Mono',monospace}
  .small-val{font-size:15px;color:rgba(255,255,255,.82);line-height:1.5}
  .small-val .dot{color:#22d3ee;margin:0 4px}
  .label-txt{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:#facc15}
  .mono-val{font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(255,255,255,.88)}
  .mono-val .hash{color:#22d3ee}
  .mono-val .ok{color:#4ade80}
  .muted-txt{font-size:13px;color:rgba(255,255,255,.22);font-style:italic}
  .corner{position:absolute;top:10px;right:12px;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.05em}
</style></head>
<body><div class="card">
  <div class="tile hero">
    <div class="chip">Body · 16</div>
    <div class="hero-quote">Describe <em>what you want</em> to generate, and the palette will follow the light.</div>
    <div class="hero-cite">placeholder · fg-1 .92</div>
  </div>

  <div class="tile small">
    <span class="corner">sm / 14</span>
    <div class="chip">Small · metadata</div>
    <div class="small-val">832 × 1216<span class="dot">·</span>Pony XL</div>
  </div>

  <div class="tile label">
    <span class="corner">xs / 12</span>
    <div class="chip" style="margin-bottom:14px">Label · uppercase</div>
    <div class="label-txt">Positive prompt</div>
  </div>

  <div class="tile mono">
    <span class="corner">mono / 14</span>
    <div class="chip">JetBrains Mono</div>
    <div class="mono-val"><span class="hash">#06B6D4</span> <span class="ok">✓</span> oklch(71% .15 210)</div>
  </div>

  <div class="tile muted">
    <span class="corner">disabled</span>
    <div class="chip">Empty state</div>
    <div class="muted-txt">No models match "violet"</div>
  </div>
</div></body></html>
