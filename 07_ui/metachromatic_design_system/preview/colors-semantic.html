<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0a0e1a;color:#fff;font-family:'Prompt',sans-serif;padding:0}
  .card{padding:24px 28px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .row{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .dot{width:40px;height:40px;border-radius:10px}
  .lbl{font-size:11px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
  .hex{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.4)}
  .bg{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:500}
</style></head>
<body><div class="card">
  <div class="row"><div class="dot" style="background:#22c55e;box-shadow:0 0 12px rgba(34,197,94,.55)"></div><div class="lbl">Success</div><div class="hex">#22C55E</div><span class="bg" style="background:rgba(34,197,94,.15);color:#4ade80">Saved</span></div>
  <div class="row"><div class="dot" style="background:#eab308;box-shadow:0 0 12px rgba(234,179,8,.55)"></div><div class="lbl">Warning</div><div class="hex">#EAB308</div><span class="bg" style="background:rgba(234,179,8,.15);color:#facc15">Check</span></div>
  <div class="row"><div class="dot" style="background:#e11d48;box-shadow:0 0 12px rgba(225,29,72,.55)"></div><div class="lbl">Error</div><div class="hex">#E11D48</div><span class="bg" style="background:rgba(225,29,72,.15);color:#fb7185">Failed</span></div>
  <div class="row"><div class="dot" style="background:#06b6d4;box-shadow:0 0 12px rgba(6,182,212,.55)"></div><div class="lbl">Info</div><div class="hex">#06B6D4</div><span class="bg" style="background:rgba(6,182,212,.15);color:#22d3ee">Running</span></div>
</div></body></html>
