<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#050812;color:#fff;font-family:'Prompt',sans-serif}
  .card{padding:28px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
  .prismatic{font-size:48px;font-weight:700;letter-spacing:-.03em;background:linear-gradient(135deg,#1e3a8a 0%,#06b6d4 15%,#7c3aed 30%,#c026d3 45%,#e11d48 55%,#f97316 70%,#eab308 85%,#22c55e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;line-height:1}
  .glow{font-size:24px;font-weight:600;color:rgba(255,255,255,.95);text-shadow:0 0 20px rgba(6,182,212,.45)}
  .lbl{font-size:11px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.08em;font-family:'JetBrains Mono',monospace}
</style></head>
<body><div class="card">
  <span class="lbl">Prismatic text · gradient fill</span>
  <span class="prismatic">MetaChromatic</span>
  <span class="lbl">Cyan text glow · headline emphasis</span>
  <span class="glow">Models · 24 available</span>
</div></body></html>
