<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#050812;background-image:radial-gradient(ellipse 70% 45% at 15% 0%,rgba(6,182,212,0.07) 0%,transparent 65%),radial-gradient(ellipse 55% 40% at 85% 90%,rgba(139,92,246,0.06) 0%,transparent 60%);color:#fff;font-family:'Prompt',system-ui,sans-serif;}
  .card{padding:24px 28px;display:flex;gap:20px;align-items:stretch;flex-wrap:wrap}
  .sw{width:104px;height:104px;border-radius:12px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
  .sw .hex{font-family:'JetBrains Mono',monospace;font-size:10px;color:#fff;opacity:.85;letter-spacing:.03em;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .sw .nm{font-size:10px;opacity:.55;color:#fff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
</style></head>
<body><div class="card">
  <div class="sw" style="background:#1e3a8a"><div class="nm">blue</div><div class="hex">#1E3A8A</div></div>
  <div class="sw" style="background:#06b6d4"><div class="nm">cyan</div><div class="hex">#06B6D4</div></div>
  <div class="sw" style="background:#7c3aed"><div class="nm">purple</div><div class="hex">#7C3AED</div></div>
  <div class="sw" style="background:#c026d3"><div class="nm">magenta</div><div class="hex">#C026D3</div></div>
  <div class="sw" style="background:#e11d48"><div class="nm">rose</div><div class="hex">#E11D48</div></div>
  <div class="sw" style="background:#f97316"><div class="nm">orange</div><div class="hex">#F97316</div></div>
  <div class="sw" style="background:#eab308"><div class="nm">yellow</div><div class="hex">#EAB308</div></div>
  <div class="sw" style="background:#22c55e"><div class="nm">green</div><div class="hex">#22C55E</div></div>
</div></body></html>
