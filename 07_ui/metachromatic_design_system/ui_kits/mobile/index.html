<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MetaChromatic — Mobile UI Kit</title>
<link rel="icon" href="../../assets/metachromatic-favicon.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html,body{margin:0;height:100%;background:#02040a;font-family:'Prompt',sans-serif}
  #root{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  @keyframes mcShim{0%{background-position:-200% 0}100%{background-position:200% 0}}
  select option{background:#0d1117}
  ::-webkit-scrollbar{width:3px;height:3px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
</style>
</head>
<body class="mc">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="NavBar.jsx"></script>
<script type="text/babel" src="ModelGallery.jsx"></script>
<script type="text/babel" src="Generator.jsx"></script>
<script type="text/babel" src="ReviewQueue.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  const [tab, setTab] = useState('generate');
  const [detail, setDetail] = useState(null);

  const screen =
    detail ? <ModelDetail model={detail} onBack={() => setDetail(null)} /> :
    tab === 'models'   ? <ModelGallery onOpen={setDetail} /> :
    tab === 'generate' ? <Generator /> :
    tab === 'review'   ? <ReviewQueue /> :
    <Placeholder name={tab} />;

  return (
    <IOSDevice width={390} height={780} dark={true}>
      <div style={{
        position: 'relative', height: '100%',
        background: '#050812',
        backgroundImage: 'radial-gradient(ellipse 70% 45% at 15% 0%, rgba(6,182,212,0.07) 0%, transparent 65%), radial-gradient(ellipse 55% 40% at 85% 90%, rgba(139,92,246,0.06) 0%, transparent 60%)',
        backgroundAttachment: 'fixed',
        color: 'rgba(255,255,255,0.9)',
        overflow: 'hidden',
      }}>
        <div style={{ height: 'calc(100% - 64px)', overflow: 'hidden' }}>
          {screen}
        </div>
        <NavBar current={detail ? 'models' : tab} onChange={t => { setDetail(null); setTab(t); }} comfyOk={true} />
      </div>
    </IOSDevice>
  );
}

function ModelDetail({ model, onBack }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', overflow:'auto' }}>
      <div style={{
        height: 260, position: 'relative',
        background: `radial-gradient(circle at 30% 30%, ${model.hue}aa, transparent 60%), radial-gradient(circle at 70% 70%, ${model.hue}44, #0a0e1a 70%)`,
      }}>
        <button onClick={onBack} style={{
          position:'absolute', top:16, left:16, width:36, height:36, borderRadius:9999,
          background:'rgba(10,14,26,0.7)', backdropFilter:'blur(12px)',
          border:'1px solid rgba(255,255,255,0.1)', color:'#fff', cursor:'pointer', fontSize:16,
        }}>←</button>
        <div style={{ position:'absolute', left:16, right:16, bottom:14 }}>
          <div style={{ fontSize:24, fontWeight:600, color:'rgba(255,255,255,.95)', textShadow:'0 2px 8px rgba(0,0,0,.6)', fontFamily:"'Prompt',sans-serif" }}>{model.name}</div>
          <div style={{ display:'flex', gap:6, marginTop:8 }}>
            <Pill color="cyan">{model.tier}</Pill>
            <Pill color="white">{model.tag}</Pill>
          </div>
        </div>
      </div>
      <div style={{ padding:16, display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8 }}>
        {Array.from({length:9}).map((_,i)=>(
          <div key={i} style={{
            aspectRatio:'1', borderRadius:10, border:'1px solid rgba(255,255,255,.08)',
            background:`radial-gradient(circle at ${20+i*7}% ${30+i*5}%, ${model.hue}66, transparent 60%), #0a0e1a`,
          }}/>
        ))}
      </div>
    </div>
  );
}

function Placeholder({ name }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', padding:20, gap:14 }}>
      <h1 style={{ margin:0, fontSize:22, fontWeight:600, letterSpacing:'-0.02em', color:'rgba(255,255,255,.95)', textShadow:'0 0 20px rgba(6,182,212,.45)', fontFamily:"'Prompt',sans-serif", textTransform:'capitalize' }}>{name}</h1>
      <GlassPanel>
        <Label>Coming soon</Label>
        <p style={{ fontSize:13, color:'rgba(255,255,255,.55)', margin:'8px 0 0', lineHeight:1.5 }}>
          This screen is stubbed. See <span style={{fontFamily:"'JetBrains Mono',monospace", color:'#22d3ee'}}>apps/metachromatic-mobile/src/screens/</span> in the Image-Prism repo for the full implementation.
        </p>
      </GlassPanel>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
        <GlassPanel style={{padding:12}}><Label>Count</Label><div style={{fontSize:28,fontWeight:600,color:'rgba(255,255,255,.95)',marginTop:6,fontFamily:"'JetBrains Mono',monospace"}}>128</div></GlassPanel>
        <GlassPanel style={{padding:12}}><Label>Synced</Label><div style={{fontSize:28,fontWeight:600,background:'linear-gradient(135deg,#22d3ee,#a78bfa)',WebkitBackgroundClip:'text',backgroundClip:'text',WebkitTextFillColor:'transparent',marginTop:6,fontFamily:"'JetBrains Mono',monospace"}}>94%</div></GlassPanel>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
