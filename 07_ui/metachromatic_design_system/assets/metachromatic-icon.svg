<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    
    <linearGradient id="grad-left" x1="0" y1="1" x2="0.3" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1e3a8a"></stop>
      <stop offset="30%" stop-color="#0e7490"></stop>
      <stop offset="60%" stop-color="#06b6d4"></stop>
      <stop offset="85%" stop-color="#6d28d9"></stop>
      <stop offset="100%" stop-color="#7c3aed"></stop>
    </linearGradient>

    
    <linearGradient id="grad-left-diag" x1="0.1" y1="0" x2="0.5" y2="0.8" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7c3aed"></stop>
      <stop offset="40%" stop-color="#a855f7"></stop>
      <stop offset="100%" stop-color="#c026d3"></stop>
    </linearGradient>

    
    <linearGradient id="grad-right-diag" x1="0.5" y1="0.8" x2="0.9" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#c026d3"></stop>
      <stop offset="40%" stop-color="#e11d48"></stop>
      <stop offset="100%" stop-color="#f97316"></stop>
    </linearGradient>

    
    <linearGradient id="grad-right" x1="0.7" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f97316"></stop>
      <stop offset="35%" stop-color="#eab308"></stop>
      <stop offset="70%" stop-color="#84cc16"></stop>
      <stop offset="100%" stop-color="#22c55e"></stop>
    </linearGradient>

    
    <linearGradient id="depth-left" x1="0.1" y1="1" x2="0.3" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0f2057"></stop>
      <stop offset="50%" stop-color="#0c5a6e"></stop>
      <stop offset="100%" stop-color="#4c1d95"></stop>
    </linearGradient>

    
    <linearGradient id="depth-right" x1="0.7" y1="0" x2="0.95" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#b45309"></stop>
      <stop offset="50%" stop-color="#a16207"></stop>
      <stop offset="100%" stop-color="#166534"></stop>
    </linearGradient>

    
    <radialGradient id="glow-center" cx="0.5" cy="0.3" r="0.4" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"></stop>
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.2"></stop>
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.08"></stop>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"></stop>
    </radialGradient>

    
    <radialGradient id="wireframe-glow" cx="0.5" cy="0.45" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"></stop>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.06"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"></stop>
    </radialGradient>

    
    <radialGradient id="bg-glow" cx="0.5" cy="0.4" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1a1f3a"></stop>
      <stop offset="100%" stop-color="#0a0e1a"></stop>
    </radialGradient>

    
    <clipPath id="squircle">
      <rect x="8" y="8" width="496" height="496" rx="110" ry="110"></rect>
    </clipPath>

    
    <filter id="m-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"></feGaussianBlur>
      <feOffset dx="0" dy="4" result="offset"></feOffset>
      <feFlood flood-color="#000000" flood-opacity="0.3" result="color"></feFlood>
      <feComposite in="color" in2="offset" operator="in" result="shadow"></feComposite>
      <feMerge>
        <feMergeNode in="shadow"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bg-glow)"></rect>

  
  <rect x="4" y="4" width="504" height="504" rx="112" ry="112" fill="none" stroke="#3a4a6b" stroke-opacity="0.4" stroke-width="2"></rect>

  
  <g opacity="0.1" stroke="url(#wireframe-glow)" stroke-width="1" fill="none" clip-path="url(#squircle)">
    
