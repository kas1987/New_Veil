    <path d="&#xA;      M 248,275&#xA;      C 256,280 264,278 268,270&#xA;      C 270,260 268,248 262,230&#xA;      L 252,205&#xA;      C 262,225 275,245 288,258&#xA;      L 310,275&#xA;      C 318,280 326,278 330,270&#xA;      C 332,260 330,248 324,230&#xA;      L 355,130&#xA;      C 365,115 377,105 388,102&#xA;      L 395,105&#xA;      C 380,90 365,85 352,92&#xA;      L 310,115&#xA;      C 295,125 280,145 268,170&#xA;      Z&#xA;    " fill="url(#grad-right-diag)"></path>
    
