    <line x1="60" y1="180" x2="452" y2="332"></line>
    <line x1="452" y1="180" x2="60" y2="332"></line>
  </g>

  
  <ellipse cx="256" cy="170" rx="140" ry="110" fill="url(#glow-center)" opacity="0.7"></ellipse>

  
